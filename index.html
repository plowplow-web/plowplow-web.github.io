<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammad Mani Omidzadeh Nik</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦇</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070b;
    --bg-2:#0d0e16;
    --ink:#f2f2f5;
    --ink-dim:#a7a7b4;
    --accent:#3fa3d6;
    --accent-soft:rgba(63,163,214,0.18);
    --glass-bg:rgba(255,255,255,0.06);
    --glass-border:rgba(255,255,255,0.14);
    --glass-shine:rgba(255,255,255,0.25);
    --shadow:rgba(0,0,0,0.5);
    --star:255,255,255;
  }
  :root[data-theme="light"]{
    --bg:#eef1f5;
    --bg-2:#e2e6ee;
    --ink:#14151c;
    --ink-dim:#5c5f6c;
    --accent:#1f7ab0;
    --accent-soft:rgba(31,122,176,0.14);
    --glass-bg:rgba(255,255,255,0.5);
    --glass-border:rgba(20,21,28,0.1);
    --glass-shine:rgba(255,255,255,0.7);
    --shadow:rgba(20,30,50,0.18);
    --star:20,25,40;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    overflow-x:hidden;
    transition:background .5s ease, color .5s ease;
    position:relative;
  }
  [data-lang="fa"] .fa-font{font-family:'Vazirmatn','Inter',sans-serif;}
  [data-lang="en"] .en-font{font-family:'Sora','Inter',sans-serif;}

  canvas#bg{
    position:fixed; inset:0; width:100%; height:100%; z-index:1; display:block;
  }
  .bg-gradient{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 50% 8%, var(--accent-soft), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    transition:background .5s ease;
  }

  .scene{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
    perspective:1200px;
  }

  /* ---------- Top bar (fixed positions, never move on language switch) ---------- */
  .topbar{
    position:fixed; top:20px; left:0; right:0; z-index:10;
    display:flex; justify-content:space-between; align-items:center;
    padding:0 22px; pointer-events:none;
  }
  .topbar > *{pointer-events:auto;}
  .pill-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    color:var(--ink);
    padding:10px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 6px 20px var(--shadow);
    transition:transform .25s ease, background .4s ease, border-color .4s ease;
    user-select:none;
    width:auto;
    white-space:nowrap;
  }
  .pill-btn:active{transform:scale(0.93);}
  .pill-btn svg{width:16px;height:16px;flex:none;}

  #langToggle{min-width:64px; justify-content:center;}
  #themeToggle{width:40px; height:40px; padding:0; justify-content:center; border-radius:50%;}

  /* ---------- Glass card ---------- */
  .card{
    position:relative;
    width:min(380px, 92vw);
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border-radius:28px;
    padding:38px 30px 30px;
    text-align:center;
    box-shadow:0 20px 60px var(--shadow), inset 0 1px 0 var(--glass-shine);
    transform-style:preserve-3d;
    transition:background .5s ease, border-color .5s ease, box-shadow .3s ease;
    will-change:transform;
  }
  .card::before{
    content:"";
    position:absolute; inset:0; border-radius:28px; padding:1px;
    background:linear-gradient(135deg, var(--glass-shine), transparent 40%, transparent 60%, var(--glass-shine));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:.5; pointer-events:none;
  }

  .avatar-wrap{
    position:relative;
    width:148px; height:148px;
    margin:0 auto 22px;
  }
  .avatar-ring{
    position:absolute; inset:-8px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent), transparent 30%, transparent 70%, var(--accent));
    animation:spin 7s linear infinite;
    opacity:.85;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .avatar{
    position:absolute; inset:4px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid var(--bg);
    box-shadow:0 8px 24px var(--shadow);
    background:#000;
  }
  .avatar img{
    width:100%; height:100%; object-fit:cover; object-position:50% 18%;
    display:block;
  }

  h1.name{
    margin:0 0 6px;
    font-size:21px;
    font-weight:700;
    letter-spacing:.2px;
    line-height:1.35;
    min-height:57px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  [data-lang="fa"] h1.name{ font-size:22px; }
  p.role{
    margin:0 0 22px;
    font-size:14px;
    color:var(--ink-dim);
    font-weight:500;
    min-height:18px;
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--glass-border), transparent);
    margin:0 0 22px;
  }

  .socials{
    display:flex; justify-content:center; gap:12px; flex-wrap:wrap;
  }
  .icon-btn{
    position:relative;
    width:46px; height:46px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    color:var(--ink);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    cursor:pointer;
    overflow:hidden;
    text-decoration:none;
    transition:transform .2s ease, border-color .3s ease;
  }
  .icon-btn svg{width:20px;height:20px; position:relative; z-index:2;}
  .icon-btn:hover{transform:translateY(-3px); border-color:var(--accent);}
  .icon-btn:active{transform:scale(0.88);}

  /* ripple */
  .ripple{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 70%);
    opacity:.55; transform:scale(0); pointer-events:none;
    animation:rippleAnim .6s ease-out forwards;
    z-index:1;
  }
  @keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }

  .tagline{
    margin-top:22px;
    font-size:12.5px;
    color:var(--ink-dim);
    line-height:1.7;
    min-height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* click burst particles (global) */
  .burst-particle{
    position:fixed; z-index:50; pointer-events:none;
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    top:0; left:0;
  }

  @media (max-width:420px){
    .card{padding:32px 22px 26px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
</style>
</head>

  en:{
    name:"Mohammad Mani Omidzadeh Nik",
    role:"Creator · Developer · Designer",
    tagline:"Building things at the edge of code and imagination.",
    langBtn:"FA"
  },
  fa:{
    name:"محمد مانی امید زاده نیک",
    role:"خالق · توسعه‌دهنده · طراح",
    tagline:"ساختن چیزهایی در مرز کد و تخیل.",
    langBtn:"EN"
  }
};
const nameEl = document.getElementById('nameText');
const roleEl = document.getElementById('roleText');
const tagEl = document.getElementById('taglineText');
const langBtn = document.getElementById('langToggle');
const body = document.body;

function applyLang(lang){
  const t = i18n[lang];
  root.setAttribute('data-lang', lang);
  nameEl.textContent = t.name;
  roleEl.textContent = t.role;
  tagEl.textContent = t.tagline;
  langBtn.textContent = t.langBtn;
  // Only the text content switches direction/font; layout (icons, buttons) stays fixed.
  [nameEl, roleEl, tagEl].forEach(el=>{
    el.dir = lang === 'fa' ? 'rtl' : 'ltr';
    el.classList.toggle('fa-font', lang === 'fa');
    el.classList.toggle('en-font', lang === 'en');
  });
  localStorage.setItem('mmn-lang', lang);
}
let savedLang = 'en';
try{ savedLang = localStorage.getItem('mmn-lang') || 'en'; }catch(e){}
applyLang(savedLang);

langBtn.addEventListener('click', ()=>{
  const cur = root.getAttribute('data-lang');
  applyLang(cur === 'en' ? 'fa' : 'en');
});

/* ---------------- 3D TILT ON CARD (smoothed / lerped) ---------------- */
const card = document.getElementById('card');
let tiltTargetX = 0, tiltTargetY = 0, tiltCurX = 0, tiltCurY = 0;
function setTiltTarget(x, y){
  const r = card.getBoundingClientRect();
  const px = (x - r.left) / r.width - 0.5;
  const py = (y - r.top) / r.height - 0.5;
  tiltTargetX = px * 10;
  tiltTargetY = -py * 10;
}
window.addEventListener('mousemove', e=> setTiltTarget(e.clientX, e.clientY));
window.addEventListener('mouseleave', ()=>{ tiltTargetX = 0; tiltTargetY = 0; });
/* touch no longer tilts the card — it stays put when tapped/touched */

function tiltLoop(){
  tiltCurX += (tiltTargetX - tiltCurX) * 0.08;
  tiltCurY += (tiltTargetY - tiltCurY) * 0.08;
  card.style.transform = `rotateY(${tiltCurX}deg) rotateX(${tiltCurY}deg) translateZ(0)`;
  requestAnimationFrame(tiltLoop);
}
requestAnimationFrame(tiltLoop);

/* ---------------- ICON RIPPLE ---------------- */
document.querySelectorAll('.icon-btn, .pill-btn').forEach(btn=>{
  btn.addEventListener('pointerdown', e=>{
    const r = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(r.width, r.height) * 1.4;
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - r.left - size/2) + 'px';
    ripple.style.top = (e.clientY - r.top - size/2) + 'px';
    btn.style.position = btn.style.position || 'relative';
    btn.appendChild(ripple);
    setTimeout(()=> ripple.remove(), 650);
  });
});

/* ---------------- GLOBAL CLICK/TOUCH BURST ---------------- */
function burst(x, y){
  const n = 8;
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'burst-particle';
    document.body.appendChild(p);
    const angle = (Math.PI*2*i)/n + Math.random()*0.4;
    const dist = 24 + Math.random()*26;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    p.style.left = x+'px';
    p.style.top = y+'px';
    p.animate([
      {transform:'translate(-50%,-50%) scale(1)', opacity:1},
      {transform:`translate(${dx-3}px, ${dy-3}px) scale(0)`, opacity:0}
    ], {duration:550+Math.random()*200, easing:'cubic-bezier(.2,.8,.2,1)'});
    setTimeout(()=>p.remove(), 800);
  }
}
window.addEventListener('pointerdown', (e)=>{
  if(e.target.closest('.icon-btn') || e.target.closest('.pill-btn')) return;
  burst(e.clientX, e.clientY);
});

/* ---------------- ANIMATED FLOW-FIELD BACKGROUND (reacts to touch) ---------------- */
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = innerWidth * DPR;
  H = canvas.height = innerHeight * DPR;
  canvas.style.width = innerWidth+'px';
  canvas.style.height = innerHeight+'px';
}
resize();
window.addEventListener('resize', ()=>{ resize(); initParticles(); });

// cheap smooth pseudo-noise (sum of sines) — no external lib needed
function noise2(x, y, t){
  return (
    Math.sin(x*0.9 + t*0.6) +
    Math.sin(y*1.3 - t*0.4) +
    Math.sin((x+y)*0.6 + t*0.3) +
    Math.sin(Math.sqrt(x*x+y*y)*0.8 - t*0.5)
  ) / 4;
}

const DENSITY = 60; // px per cell, smaller = more particles
let cols, rows, particles = [];

function initParticles(){
  cols = Math.ceil(innerWidth / DENSITY) + 2;
  rows = Math.ceil(innerHeight / DENSITY) + 2;
  particles = [];
  const count = Math.min(cols*rows, 260);
  for(let i=0;i<count;i++){
    particles.push({
      x: Math.random()*innerWidth,
      y: Math.random()*innerHeight,
      life: Math.random()*1,
      speed: 0.35 + Math.random()*0.5,
      r: 0.6 + Math.random()*1.4
    });
  }
}
initParticles();

// ripples spawned by touch/click — each pushes the flow field outward, then fades
let ripples = [];
function spawnRipple(x, y){
  ripples.push({ x, y, born: performance.now(), life: 1600, power: 1 });
  if(ripples.length > 6) ripples.shift();
}
window.addEventListener('pointerdown', e=>{
  spawnRipple(e.clientX, e.clientY);
});
window.addEventListener('touchstart', e=>{
  for(const t of e.touches) spawnRipple(t.clientX, t.clientY);
}, {passive:true});

let mouseX = innerWidth/2, mouseY = innerHeight/2;
let mouseXs = mouseX, mouseYs = mouseY; // smoothed
window.addEventListener('mousemove', e=>{ mouseX = e.clientX; mouseY = e.clientY; });

function fieldColor(alpha){
  const cs = getComputedStyle(root).getPropertyValue('--star').trim();
  return `rgba(${cs},${alpha})`;
}
function accentColor(alpha){
  const cs = getComputedStyle(root).getPropertyValue('--accent').trim();
  return cs.startsWith('#') ? hexToRgba(cs, alpha) : cs;
}
function hexToRgba(hex, a){
  const v = hex.replace('#','');
  const bigint = parseInt(v.length===3 ? v.split('').map(c=>c+c).join('') : v, 16);
  const r = (bigint>>16)&255, g=(bigint>>8)&255, b=bigint&255;
  return `rgba(${r},${g},${b},${a})`;
}

let lastT = 0;
function loop(t){
  t = t || 0;
  const dt = Math.min((t - lastT) / 16.67, 2.5) || 1;
  lastT = t;
  const tSec = t * 0.001;

  mouseXs += (mouseX - mouseXs) * 0.05;
  mouseYs += (mouseY - mouseYs) * 0.05;

  // trailing fade: erase a bit of alpha each frame (keeps canvas transparent
  // so the gradient glow behind stays visible) -> smooth flowing streaks
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'source-over';

  const now = performance.now();
  ripples = ripples.filter(r => now - r.born < r.life);

  for(const p of particles){
    // base flow angle from pseudo-noise
    const nx = p.x * 0.004, ny = p.y * 0.004;
    let angle = noise2(nx, ny, tSec) * Math.PI * 2;

    // gentle pull toward cursor (parallax feel)
    const dxm = mouseXs - p.x, dym = mouseYs - p.y;
    const distm = Math.hypot(dxm, dym) || 1;
    angle += Math.atan2(dym, dxm) * (18 / (distm+180)) * 0.3;

    // ripple influence: swirl + push outward, decaying with time & distance
    let boost = 0;
    for(const r of ripples){
      const age = (now - r.born) / r.life; // 0..1
      const radius = age * Math.max(innerWidth, innerHeight) * 0.9;
      const dx = p.x - r.x, dy = p.y - r.y;
      const dist = Math.hypot(dx, dy);
      const band = 160; // wave thickness
      const proximity = Math.max(0, 1 - Math.abs(dist - radius) / band);
      const fade = (1 - age);
      const strength = proximity * fade;
      if(strength > 0.001){
        const outward = Math.atan2(dy, dx);
        angle = angle * (1-strength) + (outward + Math.PI/2 * (dist<radius?1:-1)) * strength;
        boost += strength;
      }
    }

    const speed = p.speed * (1 + boost*3) * dt;
    p.x += Math.cos(angle) * speed;
    p.y += Math.sin(angle) * speed;
    p.life += 0.004 * dt;

    if(p.x < -20) p.x = innerWidth+20;
    if(p.x > innerWidth+20) p.x = -20;
    if(p.y < -20) p.y = innerHeight+20;
    if(p.y > innerHeight+20) p.y = -20;

    const alpha = (0.35 + Math.sin(p.life*3)*0.2) * (0.5 + Math.min(boost,1)*0.5);
    const useAccent = boost > 0.08;
    ctx.beginPath();
    ctx.fillStyle = useAccent ? accentColor(Math.min(alpha+0.25,0.95)) : fieldColor(alpha);
    const rad = (p.r + boost*2.2) * DPR;
    ctx.arc(p.x*DPR, p.y*DPR, rad, 0, Math.PI*2);
    ctx.fill();
  }

  // expanding ring outlines for each ripple (visible energy wave)
  for(const r of ripples){
    const age = (now - r.born) / r.life;
    const radius = age * Math.max(innerWidth, innerHeight) * 0.9;
    const alpha = (1 - age) * 0.35;
    ctx.beginPath();
    ctx.strokeStyle = accentColor(alpha);
    ctx.lineWidth = 1.5 * DPR;
    ctx.arc(r.x*DPR, r.y*DPR, radius*DPR, 0, Math.PI*2);
    ctx.stroke();
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
